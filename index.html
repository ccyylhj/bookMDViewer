<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Viewer</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="toolbar">
      <button id="open-btn" class="icon-btn" title="Open file (Ctrl+O)" aria-label="Open file">📂</button>
      <button id="files-btn" class="icon-btn" title="File explorer (Ctrl+B)" aria-label="File explorer">🗂</button>
      <button id="font-dec" class="icon-btn" title="Decrease font (Ctrl+-)" aria-label="Decrease font size">A−</button>
      <button id="font-inc" class="icon-btn" title="Increase font (Ctrl++)" aria-label="Increase font size">A+</button>
      <button id="wide-toggle" class="icon-btn" title="宽版 / 窄版切换 (Ctrl+Shift+\)" aria-label="Toggle wide content">↔</button>
      <button id="theme-toggle" class="icon-btn" title="主题:亮色 (点击切换)" aria-label="Toggle color theme">☀️</button>
      <button id="settings-btn" class="icon-btn" title="设置" aria-label="Settings">⚙</button>
      <button id="save-btn" title="Save (Ctrl+S)" aria-label="Save" hidden>💾 Save</button>
      <button id="export-btn" title="Export to HTML" aria-label="Export to HTML">⬇ HTML</button>
      <button id="edit-toggle" title="Toggle edit mode (Ctrl+E)" aria-label="Toggle edit mode">✎ Edit</button>
      <button id="toc-toggle" title="Toggle outline (Ctrl+\)" aria-label="Toggle outline">☰</button>
      <button id="close-doc-btn" class="icon-btn" title="Close document — back to home" aria-label="Close document" hidden>✕</button>
    </div>
    <div id="toast" hidden></div>
    <div id="find-bar" hidden>
      <input id="find-input" type="text" placeholder="Find…" spellcheck="false" />
      <span id="find-count"></span>
      <button id="find-prev" title="Previous (Shift+Enter)" aria-label="Previous match">↑</button>
      <button id="find-next" title="Next (Enter)" aria-label="Next match">↓</button>
      <button id="find-close" title="Close (Esc)" aria-label="Close find">✕</button>
    </div>
    <div id="layout">
      <nav id="files" aria-label="File explorer"></nav>
      <div id="files-resizer" class="panel-resizer" title="拖动调整宽度，双击恢复默认"></div>
      <nav id="toc" aria-label="Table of contents"></nav>
      <div id="toc-resizer" class="panel-resizer" title="拖动调整宽度，双击恢复默认"></div>
      <textarea
        id="editor"
        spellcheck="false"
        placeholder="Markdown source…"
      ></textarea>
      <article id="content" class="markdown-body">
        <div class="empty-state">
          <h1>Markdown Viewer</h1>
          <p>Drag a <code>.md</code> file here, or <a id="empty-open" href="#">open one</a>.</p>
          <p class="app-version"><a id="about-open" href="#">关于 / About</a></p>
          <div id="recent-list"></div>
        </div>
      </article>
    </div>

    <div id="diagram-modal" hidden>
      <div id="diagram-toolbar">
        <button id="dg-zoomout" title="Zoom out">−</button>
        <span id="dg-zoom">100%</span>
        <button id="dg-zoomin" title="Zoom in">+</button>
        <button id="dg-reset" title="Fit to screen">Reset</button>
        <button id="dg-close" title="Close (Esc)">✕</button>
      </div>
      <div id="diagram-stage"></div>
    </div>

    <div id="settings-modal" hidden>
      <div class="modal-box settings-box">
        <div class="settings-title">设置 / Settings</div>
        <div class="settings-row">
          <label for="font-latin">英文字体 / Latin font</label>
          <select id="font-latin"></select>
        </div>
        <input id="font-latin-custom" class="font-custom" list="font-list" placeholder="输入字体名称…" spellcheck="false" autocomplete="off" hidden />
        <div class="settings-row">
          <label for="font-cjk">中文字体 / CJK font</label>
          <select id="font-cjk"></select>
        </div>
        <input id="font-cjk-custom" class="font-custom" list="font-list" placeholder="输入字体名称…" spellcheck="false" autocomplete="off" hidden />
        <datalist id="font-list"></datalist>
        <div class="settings-row">
          <label for="narrow-width">窄版最大宽度 (px)</label>
          <input id="narrow-width" type="number" min="480" max="1400" step="10" />
        </div>

        <div class="settings-sep"></div>
        <div class="settings-title">软件更新 / Updates</div>
        <div class="settings-row">
          <span class="settings-ver">当前版本 <span id="update-current"></span></span>
          <button id="update-check">检查更新</button>
        </div>
        <div class="update-status" id="update-status" hidden></div>

        <div class="modal-actions">
          <button id="settings-reset">重置字体</button>
          <button id="settings-close">关闭</button>
        </div>
      </div>
    </div>

    <div id="about-modal" hidden>
      <div class="modal-box about-box">
        <div class="about-logo">📘</div>
        <div class="about-name">Markdown Viewer</div>
        <div class="about-ver" id="about-version"></div>
        <p class="about-desc">
          轻量、完全本地、开源的 Markdown 查看器与编辑器。<br />
          Lightweight, local-first, open-source Markdown viewer &amp; editor.
        </p>
        <div class="modal-actions">
          <button id="about-github">GitHub ↗</button>
          <button id="about-close">关闭</button>
        </div>
      </div>
    </div>

    <div id="close-modal" hidden>
      <div class="modal-box">
        <p>有未保存的更改,关闭前要保存吗?</p>
        <div class="modal-actions">
          <button id="modal-save">保存并关闭</button>
          <button id="modal-discard">不保存关闭</button>
          <button id="modal-cancel">取消</button>
        </div>
      </div>
    </div>
  </body>
</html>
